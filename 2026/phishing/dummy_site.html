<title>Browser Compliance Verification</title>
<style>
body {
  margin:0; background:#f4f6f8; font-family:Arial,sans-serif; color:#1f2933;
}
.wrap { max-width:480px; margin:60px auto; padding:20px; }
.card {
  background:#fff; border:1px solid #d9dee5; border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.08); overflow:hidden;
}
.header { background:#2c3e50; color:#fff; text-align:center; padding:24px 20px; }
.header img {
  width:145px; height:auto; background:#fff; padding:8px;
  border-radius:6px; margin-bottom:12px;
}
.content { padding:28px; }
label { display:block; font-weight:700; margin:14px 0 6px; }
input {
  width:100%; box-sizing:border-box; padding:11px 12px;
  border:1px solid #b7c0cb; border-radius:5px; font-size:15px;
}
button {
  width:100%; margin-top:22px; padding:12px 16px; border:0;
  border-radius:5px; background:#2980b9; color:#fff;
  font-size:16px; font-weight:700; cursor:pointer;
}
.note { margin-top:18px; color:#66727f; font-size:12px; line-height:1.5; }
.success {
  display:none; background:#eef7f0; border:1px solid #b8d9bf;
  border-radius:6px; padding:16px; margin-top:18px;
}
</style>
